name: 'W2V2_COAASIST_LA19'

model:
  teacher:
    name: 'W2V2_COAASIST'
    teacher_module_paths: []
    teacher_module_ios: []
    pretrained_path: '' 
    is_parallel: True

  student:
    name: 'SelfDistil_W2V2BASE_AASISTL'
    student_module_paths: []
    student_module_ios: []

is_learning_rate_scheduler: False

learning_rate_scheduler:
  name: 'MultiStepLR'
  params:
    milestones: [10, 50] # Warmup for 10 epochs
    gamma: 0.1
    verbose: False

train:

  learning_rate: 0.000001
  weight_decay: 0.00001
  batch_size: 20
  num_epochs: 500
  num_workers: 4
  amp: False
  teacher: True
  patience: 30
  seed: 154
  freeze_ssl_num_epoch: 0 # 0 for no freeze
  dataset: 'LA19'
  train_teacher: True
  ssl_teacher_path: '/datab/hungdx/KDW2V-AASISTL/xlsr2_300m.pt'
  augment_mode: 'rawboost' # 'rawboost' for rawboost, 'audiomentations' for audiomentations
  algo: -1 # No augmentations
  student_resume: ''
  
  cross_entropy_loss_weight: [0.1, 0.9]
  

criterion_weights: [1]

criterions:

