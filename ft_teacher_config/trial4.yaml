name: 'Rawformer_SE_W2V_LA19'

model:
  teacher:
    name: 'Rawformer_SE_W2V'
    teacher_module_paths: []
    teacher_module_ios: []
    pretrained_path: '' 
    is_parallel: True

  student:
    name: 'SelfDistil_W2V2BASE_AASISTL'
    student_module_paths: []
    student_module_ios: []

is_learning_rate_scheduler: True

learning_rate_scheduler:
  name: 'StepLR'
  params:
    step_size: 10
    gamma: 0.1
    verbose: True

train:

  learning_rate: 0.0008
  weight_decay: 0.0001
  batch_size: 20
  num_epochs: 500
  num_workers: 4
  amp: False
  teacher: True
  patience: 30
  seed: 1234
  freeze_ssl_num_epoch: 10 # 0 for no freeze
  dataset: 'LA19'
  train_teacher: True
  ssl_teacher_path: '/nfs/datab/hungdx/KDW2V-AASISTL/xlsr2_300m.pt'
  augment_mode: 'rawboost' # 'rawboost' for rawboost, 'audiomentations' for audiomentations
  algo: 3
  student_resume: '/datab/hungdx/KDW2V-AASISTL/models/W2V2BASE_AASISTL_DKDLoss_cnsl_audiomentations_2/best_checkpoint_49.pth'
  
  cross_entropy_loss_weight: [0.21, 0.79]
  

criterion_weights: [1]

