name: 'W2V2BASE_AASISTL_SelfKD_KDLoss_EmbeddingLoss_trial3'
model:
  teacher:
    name: 'W2V2_AASIST'
    teacher_module_paths:
      - 'out_layer'
    teacher_module_ios:
      - 'False:True'

  student:
    name: 'SelfDistil_W2V2BASE_AASISTL'
    student_module_paths:
      - 'out_layer'
    student_module_ios:
      - 'False:True'

train:
  learning_rate: 0.000001
  weight_decay: 0.0001
  batch_size: 64
  num_epochs: 300
  num_workers: 4
  amp: True
  teacher: True
  patience: 30
  seed: 42

criterion_weights: [0.9]

criterions:

  - key: 'PKTLoss'
    kwargs:
      student_module_path: 'out_layer'
      student_module_io: 'output'
      teacher_module_path: 'out_layer'
      teacher_module_io: 'output'
      eps: 0.0000001
  