name: 'W2V2BASE_AASISTL_OCKDLoss_cnsl_v4'

model:
  teacher:
    name: 'W2V2_AASIST'
    teacher_module_paths:
      - 'ssl_model.model.encoder.layers.4.fc2'
      - 'ssl_model.model.encoder.layers.9.fc2'
      - 'ssl_model.model.encoder.layers.14.fc2'
      - 'ssl_model.model.encoder.layers.19.fc2'
      - 'out_layer'
    teacher_module_ios:
      - 'False:True'
      - 'False:True'
      - 'False:True'
      - 'False:True'
      - 'False:True'
    pretrained_path: '/datab/hungdx/KDW2V-AASISTL/supcon_jan22_longR3_epoch_43.pth'
    is_parallel: False

  student:
    name: 'SelfDistil_W2V2BASE_AASISTL'
    student_module_paths:
      - 'ssl_model.model.encoder.layers.2.fc2'
      - 'ssl_model.model.encoder.layers.5.fc2'
      - 'ssl_model.model.encoder.layers.8.fc2'
      - 'ssl_model.model.encoder.layers.11.fc2'
      - 'out_layer'
    student_module_ios:
      - 'False:True'
      - 'False:True'
      - 'False:True'
      - 'False:True'
      - 'False:True'
      

is_learning_rate_scheduler: False

learning_rate_scheduler:
  name: 'MultiStepLR'
  params:
    milestones: [20, 100]
    gamma: 0.5
    verbose: True

train:

  learning_rate: 0.000001
  weight_decay: 0.00001
  batch_size: 50
  num_epochs: 500
  num_workers: 4
  amp: True
  teacher: True
  patience: 30
  seed: 42
  freeze_ssl_num_epoch: 0 # 0 for no freeze
  dataset: 'supcon_jan22'
  
  augment_mode: 'rawboost' # 'rawboost' for rawboost, 'audiomentations' for audiomentations
  algo: 8
  student_resume: '/datab/hungdx/KDW2V-AASISTL/models/W2V2BASE_AASISTL_DKDLoss_cnsl_audiomentations_2/best_checkpoint_49.pth'
  
  cross_entropy_loss_weight: [0.21, 0.79]
  

criterion_weights: [1, 0.1]

criterions:

  - key: 'DKDLoss'
    kwargs:
      student_module_path: 'out_layer'
      student_module_io: 'output'
      teacher_module_path: 'out_layer'
      teacher_module_io: 'output'
      alpha: 1
      beta: 8
      T: 4
  - key: 'OCKDLoss'
    kwargs:
      at_pairs:
        pair1:
          teacher:
            io: 'output'
            path: 'ssl_model.model.encoder.layers.4.fc2'
          student:
            io: 'output'
            path: 'ssl_model.model.encoder.layers.2.fc2'
        pair2:
          teacher:
            io: 'output'
            path: 'ssl_model.model.encoder.layers.9.fc2'
          student:
            io: 'output'
            path: 'ssl_model.model.encoder.layers.5.fc2'
        pair3:
          teacher:
            io: 'output'
            path: 'ssl_model.model.encoder.layers.14.fc2'
          student:
            io: 'output'
            path: 'ssl_model.model.encoder.layers.8.fc2'
        pair4:
          teacher:
            io: 'output'
            path: 'ssl_model.model.encoder.layers.19.fc2'
          student:
            io: 'output'
            path: 'ssl_model.model.encoder.layers.11.fc2'
        # pair5:
        #   teacher:
        #     io: 'output'
        #     path: 'out_layer'
        #   student:
        #     io: 'output'
        #     path: 'out_layer'
            
      lamd: 0.00001
      batch_size: 50

