name: 'W2V2BASE_Linear_DKDLoss_cnsl_from_bestcontrastive'
model:
  teacher:
    name: 'W2V2_NLL_Multi'
    teacher_module_paths:
      - 'LL'
      - 'backend'
    teacher_module_ios:
      - 'False:True'
      - 'False:True'
    pretrained_path: '/datab/hungdx/KDW2V-AASISTL/conf-5-linear-feb07-29-36-epoch46.pth'

    is_parallel: False

  student:
    name: 'Distil_W2V2BASE_Linear'
    student_module_paths:
      - 'LL'
      - 'backend'
    student_module_ios:
      - 'False:True'
      - 'False:True'



is_learning_rate_scheduler: True

learning_rate_scheduler:
  name: 'CosineAnnealingWarmRestarts'
  params:
    T_0: 20
    T_mult: 1
    eta_min: 0.0000001
    verbose: True

train:

  learning_rate: 0.00001
  weight_decay: 0.00001
  batch_size: 32
  num_epochs: 300
  num_workers: 4
  amp: True
  teacher: True
  patience: 30
  seed: 482
  freeze_ssl_num_epoch: 0 # 0 for no freeze
  dataset: 'supcon_feb07'
  augment_mode: 'audiomentations' # 'rawboost' for rawboost, 'audiomentations' for audiomentations
  algo: 4 # No augmentation

  # Using the best checkpoint from contrastive learning
  student_resume: '/datad/utils/vocodetect/Supcon-voco/out/model_weighted_CCE_200_1_1e-06_5_augall_wav2vecbase_linear_feb07_KD_v2/epoch_14.pth' # Stateless training
  # restore: True
  cross_entropy_loss_weight: [0.21, 0.79]

  

criterion_weights: [1]

criterions:

  - key: 'DKDLoss'
    kwargs:
      student_module_path: 'backend'
      student_module_io: 'output'
      teacher_module_path: 'backend'
      teacher_module_io: 'output'
      alpha: 1
      beta: 8
      T: 4

