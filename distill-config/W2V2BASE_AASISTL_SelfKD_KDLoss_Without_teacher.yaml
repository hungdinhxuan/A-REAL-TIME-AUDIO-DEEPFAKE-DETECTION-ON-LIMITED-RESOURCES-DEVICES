name: 'W2V2BASE_AASISTL_SelfKD_KDLoss_Without_teacher'
model:
  teacher:
    name: 'W2V2_AASIST'
    teacher_module_paths:
      - 'out_layer'
    teacher_module_ios:
      - 'False:True'
      

  student:
    name: 'SelfDistil_W2V2BASE_AASISTL'
    student_module_paths:
      - 'out_layer'
    student_module_ios:
      - 'False:True'

self_kd_config:
  temperature: 3
  alpha: 0.1
  beta: 1e-6
  hidden_rep_loss_weight: 0.5

is_learning_rate_scheduler: False

train:
  learning_rate: 0.000001
  weight_decay: 0.0001
  batch_size: 64
  num_epochs: 300
  num_workers: 4
  amp: True
  teacher: False
  patience: 30
  seed: 42

# criterion_weights: [0.9]

criterions: