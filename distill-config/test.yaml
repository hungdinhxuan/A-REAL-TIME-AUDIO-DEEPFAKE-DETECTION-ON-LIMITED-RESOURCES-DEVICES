name: 'W2V2BASE_AASISTL_DistilHubertKDLoss_cnsl_audiomentations'
model:
  teacher:
    name: 'W2V2_AASIST'
    teacher_module_paths:
      - 'out_layer'
    teacher_module_ios:
      - 'True:True'
    pretrained_path: '/nfs/datab/hungdx/KDW2V-AASISTL/supcon_jan22_longR3_epoch_43.pth'
    is_parallel: False

  student:
    name: 'SelfDistil_W2V2BASE_AASISTL'
    student_module_paths:
      - 'out_layer'
    student_module_ios:
      - 'True:True'

is_learning_rate_scheduler: False

# learning_rate_scheduler:
#   name: 'MultiStepLR'
#   params:
#     milestones: [30, 80]
#     gamma: 0.15
#     verbose: False

train:
  learning_rate: 0.000005
  weight_decay: 0.00001
  batch_size: 64
  num_epochs: 300
  num_workers: 4
  amp: True
  teacher: True
  patience: 30
  seed: 42
  freeze_ssl_num_epoch: 0 # 0 for no freeze
  dataset: 'supcon_jan22'
  augment_mode: 'audiomentations' # 'rawboost' for rawboost, 'audiomentations' for audiomentations
  alpha: 0.9
  cross_entropy_loss_weight: [0.21, 0.79]
  student_resume: '/nfs/datab/hungdx/KDW2V-AASISTL/models/W2V2BASE_AASISTL_PKTLoss_cnsl/best_checkpoint_42.pth'
  

criterion_weights: [1]

criterions:

  - key: 'DistilHubertKDLoss'
    kwargs:
      student_module_path: 'out_layer'
      student_module_io: 'input'
      teacher_module_path: 'out_layer'
      teacher_module_io: 'input'
      cos_lambda: 1
      target_layer_idx: [4, 8, 12]
      ssl_hidden_size: 768

