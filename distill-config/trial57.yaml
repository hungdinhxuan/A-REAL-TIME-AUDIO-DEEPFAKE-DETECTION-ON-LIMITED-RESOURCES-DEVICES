name: 'W2V2BASE_AASISTL_SelfKD_BYOT_voxceleb2'
model:
  teacher:
    name: 'W2V2_AASIST'
    teacher_module_paths:
      - 'out_layer'
    teacher_module_ios:
      - 'True:True'
    pretrained_path: '/datab/hungdx/KDW2V-AASISTL/supcon_jan22_longR3_epoch_43.pth'
    is_parallel: False

  student:
    name: 'SelfDistil_W2V2BASE_AASISTL'
    student_module_paths:
      - 'out_layer'
    student_module_ios:
      - 'True:True'

is_learning_rate_scheduler: True

learning_rate_scheduler:
  name: 'StepLR'
  params:
    step_size: 20
    gamma: 0.5
    verbose: True


self_kd_config:
  temperature: 1
  alpha: 0.6
  beta: 1e-5
  hidden_rep_loss_weight: 0.5

train:
  learning_rate: 0.00005
  weight_decay: 0.00001
  batch_size: 16
  num_epochs: 300
  num_workers: 4
  amp: True
  teacher: False
  patience: 30
  seed: 2242
  freeze_ssl_num_epoch: 0 # 0 for no freeze
  dataset: 'voxceleb2'
  augment_mode: 'audiomentations' # 'rawboost' for rawboost, 'audiomentations' for audiomentations
  # alpha: 0.9
  # beta: 0.5
  # T: 2
  cross_entropy_loss_weight: [0.21, 0.79]
  student_resume: '/datab/hungdx/KDW2V-AASISTL/models/W2V2BASE_AASISTL_DKDLoss_cnsl_audiomentations_3_v18/best_checkpoint_71.pth'
  raytune: False

  # sup_contrastive: True
  # sup_contrastive_loss_weights: [0.07, 0.07]
  # sup_contrastive_mode: 'supcon' # 'simclr' or 'supcon'

criterions:
