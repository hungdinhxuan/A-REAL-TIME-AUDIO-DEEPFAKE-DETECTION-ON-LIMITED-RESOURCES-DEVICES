name: 'W2V2BASE_AASISTL_SelfKD_KDLoss_Without_teacher_CosineAnnealingWarmRestarts_audiomentations'
model:
  teacher:
    name: 'W2V2_AASIST'
    teacher_module_paths:
      - 'out_layer'
    teacher_module_ios:
      - 'False:True'
      

  student:
    name: 'SelfDistil_W2V2BASE_AASISTL'
    student_module_paths:
      - 'out_layer'
    student_module_ios:
      - 'False:True'

self_kd_config:
  temperature: 3
  alpha: 0.1
  beta: 1e-6
  hidden_rep_loss_weight: 0.5

learning_rate_scheduler:
  name: 'CosineAnnealingWarmRestarts'
  params:
    T_0: 8
    T_mult: 1
    eta_min: 0.000001
    verbose: False

is_learning_rate_scheduler: True

train:
  learning_rate: 0.00001
  weight_decay: 0.0001
  batch_size: 64
  num_epochs: 300
  num_workers: 4
  amp: True
  teacher: False
  patience: 30
  seed: 42
  student_resume: '/datab/hungdx/KDW2V-AASISTL/models/W2V2BASE_AASISTL_SelfKD_KDLoss_Without_teacher/best_checkpoint_126.pth'
  augment_mode: 'audiomentations'



criterions: