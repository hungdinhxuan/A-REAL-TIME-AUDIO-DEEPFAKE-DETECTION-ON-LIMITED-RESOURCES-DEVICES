name: 'W2V2BASE_AASISTL_SelfKD_KDLoss_Cosine_teacher_CosineAnnealingWarmRestarts_audiomentations_cnsl'
model:
  teacher:
    name: 'W2V2_AASIST'
    teacher_module_paths:
      - 'out_layer'
      - 'LL'
    teacher_module_ios:
      - 'False:True'
      - 'False:True'
    pretrained_path: '/datab/hungdx/KDW2V-AASISTL/supcon_jan22_longR3_epoch_43.pth'  
    is_parallel: False 
    
  student:
    name: 'SelfDistil_W2V2BASE_AASISTL'
    student_module_paths:
      - 'out_layer'
      - 'LL'
    student_module_ios:
      - 'False:True'
      - 'False:True'

self_kd_config:
  temperature: 3
  alpha: 0.1
  beta: 1e-6
  hidden_rep_loss_weight: 0.5

learning_rate_scheduler:
  name: 'CosineAnnealingWarmRestarts'
  params:
    T_0: 8
    T_mult: 1
    eta_min: 0.0000005
    verbose: False


is_learning_rate_scheduler: True

train:
  learning_rate: 0.00001
  weight_decay: 0.00001
  batch_size: 64
  num_epochs: 300
  num_workers: 4
  amp: True
  teacher: True
  patience: 30
  seed: 1142
  student_resume: '/datab/hungdx/KDW2V-AASISTL/models/W2V2BASE_AASISTL_SelfKD_KDLoss_Cosine_teacher_CosineAnnealingWarmRestarts_cnsl/best_checkpoint_66.pth'
  augment_mode: 'audiomentations'
  dataset: 'cnsl'

criterion_weights: [0.2]

criterions:
  - key: 'CosineLoss'
    kwargs:
      student_module_path: 'LL'
      student_module_io: 'output'
      teacher_module_path: 'LL'
      teacher_module_io: 'output'
      size: 64