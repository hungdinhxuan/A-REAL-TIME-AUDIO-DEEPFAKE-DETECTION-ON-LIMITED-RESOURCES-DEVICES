is_learning_rate_scheduler: True

learning_rate_scheduler:
  name: 'CosineAnnealingWarmRestarts'
  params:
    T_0: 10 # number of epochs for the first restart
    T_mult: 2 # factor to increase T_0 after each restart
    eta_min: 0.000001
    verbose: False

train:
  padding_size: 16000  # 1s for LA19_1s
  learning_rate: 0.00001
  weight_decay: 0.00001
  batch_size: 32
  num_epochs: 100
  num_workers: 4
  amp: True
  teacher: True
  patience: 20
  seed: 1234
  freeze_ssl_num_epoch: 0 # 0 for no freeze
  dataset: 'LA19_1s'
  augment_mode: 'rawboost' # 'rawboost' for rawboost, 'audiomentations' for audiomentations
  algo: 4 # No augmentation
  student_resume: '' # Stateless training
  cross_entropy_loss_weight: [0.9, 0.1]
  is_kl_loss: False
  copy_weights: False
  wandb_project_name: 'iconip2024_adaptive'
  model_to_save: 'iconip2024_adaptive_runs'
  adaptive_kd_loss: True
  wandb_disabled: False # True for disable wandb
  torchaudio_wrapper: True

criterion_weights: [1, 1, 1, 1, 1, 1]

criterions:
  - key: 'MSELoss'
    kwargs:
      student_module_path: 'ssl_model.model.encoder.transformer.layers.0.final_layer_norm'
      student_module_io: 'output'
      teacher_module_path: 'ssl_model.model.encoder.transformer.layers.0.final_layer_norm'
      teacher_module_io: 'output'
    adaptive_kwargs:
      in_features: 256
      out_features: 1024

