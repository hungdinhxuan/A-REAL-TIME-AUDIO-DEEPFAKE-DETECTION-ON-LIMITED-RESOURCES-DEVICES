  teacher:
    name: "W2V2_ConformerTCM"
    teacher_module_paths:
      - "backend"
      - "front_end.model.encoder.layers.0.final_layer_norm" # 1st layer
      - "front_end.model.encoder.layers.1.final_layer_norm" # 2nd layer
      - "front_end.model.encoder.layers.2.final_layer_norm" # 3rd layer
      - "front_end.model.encoder.layers.3.final_layer_norm" # 4th layer
      - "front_end.model.encoder.layers.4.final_layer_norm" # 5th layer
      - "front_end.model.encoder.layers.5.final_layer_norm" # 6th layer
      - "front_end.model.encoder.layers.6.final_layer_norm" # 7th layer
      - "front_end.model.encoder.layers.7.final_layer_norm" # 8th layer
      - "front_end.model.encoder.layers.8.final_layer_norm" # 9th layer
      - "front_end.model.encoder.layers.9.final_layer_norm" # 10th layer
      - "front_end.model.encoder.layers.10.final_layer_norm" # 11th layer
      - "front_end.model.encoder.layers.11.final_layer_norm" # 12th layer
      - "front_end.model.encoder.layers.12.final_layer_norm" # 13th layer
      - "front_end.model.encoder.layers.13.final_layer_norm" # 14th layer
      - "front_end.model.encoder.layers.14.final_layer_norm" # 15th layer
      - "front_end.model.encoder.layers.15.final_layer_norm" # 16th layer
      - "front_end.model.encoder.layers.16.final_layer_norm" # 17th layer
      - "front_end.model.encoder.layers.17.final_layer_norm" # 18th layer
      - "front_end.model.encoder.layers.18.final_layer_norm" # 19th layer
      - "front_end.model.encoder.layers.19.final_layer_norm" # 20th layer
      - "front_end.model.encoder.layers.20.final_layer_norm" # 21th layer
      - "front_end.model.encoder.layers.21.final_layer_norm" # 22th layer
      - "front_end.model.encoder.layers.22.final_layer_norm" # 23th layer
      - "front_end.model.encoder.layers.23.final_layer_norm" # 24th layer

    teacher_module_ios:
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"

    pretrained_path: "/nvme1/hungdx/Lightning-hydra/logs/best_ckpt/MDT_baseline_lora_june11.pth"
    is_parallel: False
    kwargs:
      args:
        emb_size: 144
        heads: 4
        kernel_size: 31
        n_encoders: 4
        type: "conv" # conv_res2net, conv_seblock, conv_res2net_seblock
        pooling: "first"
      

  student:
    name: "Distil_XLSR_N_Trans_Layer_ConformerTCM"
    student_module_paths:
      - "backend"
      - "front_end.model.encoder.layers.0.final_layer_norm" # 1st layer
      - "front_end.model.encoder.layers.1.final_layer_norm" # 2nd layer
      - "front_end.model.encoder.layers.2.final_layer_norm" # 3rd layer

    student_module_ios:
      - "False:True"
      - "False:True"
      - "False:True"
      - "False:True"


    kwargs:
      args:
          emb_size: 144
          heads: 4
          kernel_size: 31
          n_encoders: 4
          type: "conv" # conv_res2net, conv_seblock, conv_res2net_seblock
          pooling: "first"
      num_layers: 3 #
      order: "first" # 'middle' for middle layers, 'first' for first layers, 'last' for last layers, "custom" for custom layers
      #custom_order: [1, 2, 3, 4, 5] # 2, 3, 4, 5th layer

is_learning_rate_scheduler: False

learning_rate_scheduler:
  name: "MultiStepLR"
  params:
    milestones: [50, 70]
    gamma: 0.5
    verbose: True

train:
  learning_rate: 0.00001
  weight_decay: 0.0001
  batch_size: 32
  num_epochs: 300
  num_workers: 4
  amp: False
  teacher: True
  patience: 10
  alpha: 0.1 # weight for CE loss (1-beta), beta = 0.9
  seed: 12442
  freeze_ssl_num_epoch: 0 # 0 for no freeze
  dataset: "standard" # 'Jun' for Jun dataset
  augment_mode: "rawboost" # 'rawboost' for rawboost, 'audiomentations' for audiomentations
  algo: -1 # No augmentation
  student_resume: "" # Stateless training
  cross_entropy_loss_weight: [0.3, 0.7]
  is_kl_loss: False
  copy_weights: True
  padding_size: 32000 # 2s
  wandb_disabled: False

criterion_weights: [1]

criterions:
  - key: "KDLoss"
    kwargs:
      student_module_path: "backend"
      student_module_io: "output"
      teacher_module_path: "backend"
      teacher_module_io: "output"
      beta: 0.9
      temperature: 4